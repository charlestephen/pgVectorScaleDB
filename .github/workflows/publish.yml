name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve latest upstream releases
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./resolve-versions.sh versions.env
          set -a
          # shellcheck disable=SC1091
          . ./versions.env
          set +a
          {
            echo "timescale=${TIMESCALE_TAG}"
            echo "pgvector=${PGVECTOR_TAG}"
            echo "pgvectorscale=${PGVECTORSCALE_TAG}"
            echo "system_stats=${SYSTEM_STATS_TAG}"
            echo "postgresml=${POSTGRESML_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Commit version bumps
        run: |
          git add versions.env
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Track latest extension releases"
          git push

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 image for tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          platforms: linux/amd64
          tags: pgvectorscaledb:test
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            TIMESCALE_TAG=${{ steps.versions.outputs.timescale }}
            PGVECTOR_TAG=${{ steps.versions.outputs.pgvector }}
            PGVECTORSCALE_TAG=${{ steps.versions.outputs.pgvectorscale }}
            SYSTEM_STATS_TAG=${{ steps.versions.outputs.system_stats }}
            POSTGRESML_TAG=${{ steps.versions.outputs.postgresml }}

      - name: Test extensions
        run: ./test/check-extensions.sh pgvectorscaledb:test

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=min
          tags: |
            ghcr.io/${{ github.repository_owner }}/pgvectorscaledb:pg18
            ghcr.io/${{ github.repository_owner }}/pgvectorscaledb:latest
          build-args: |
            TIMESCALE_TAG=${{ steps.versions.outputs.timescale }}
            PGVECTOR_TAG=${{ steps.versions.outputs.pgvector }}
            PGVECTORSCALE_TAG=${{ steps.versions.outputs.pgvectorscale }}
            SYSTEM_STATS_TAG=${{ steps.versions.outputs.system_stats }}
            POSTGRESML_TAG=${{ steps.versions.outputs.postgresml }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=min
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pgvectorscaledb:pg18
            ${{ secrets.DOCKERHUB_USERNAME }}/pgvectorscaledb:latest
          build-args: |
            TIMESCALE_TAG=${{ steps.versions.outputs.timescale }}
            PGVECTOR_TAG=${{ steps.versions.outputs.pgvector }}
            PGVECTORSCALE_TAG=${{ steps.versions.outputs.pgvectorscale }}
            SYSTEM_STATS_TAG=${{ steps.versions.outputs.system_stats }}
            POSTGRESML_TAG=${{ steps.versions.outputs.postgresml }}

      - name: Update Docker Hub overview
        continue-on-error: true
        if: env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/pgvectorscaledb
          short-description: PostgreSQL 18 with TimescaleDB, pgvector, pgvectorscale and system_stats.
          readme-filepath: docs/dockerhub.md
